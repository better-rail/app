name: Deploy

# Deploys the Cloudflare Workers from `main`. Each app deploys only when a push touched it (or the lockfile),
# after its own tests pass. Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN  — an account token with Workers Scripts, D1, Workers KV Storage, Durable Objects and
#                           Containers edit rights (the "Edit Cloudflare Workers" template plus D1 and Containers)
#   CLOUDFLARE_ACCOUNT_ID — the Better Rail account id
# Worker secrets and the per-deployment variables (API_BASE_URL, RAIL_DATA_SOURCE) live on Cloudflare and survive
# deploys (`keep_vars`); nothing secret is in the repository.

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "apps/conductor/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      conductor: ${{ steps.filter.outputs.conductor }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - "bun.lock"
              - "package.json"
              - ".github/workflows/deploy.yml"
            api:
              - "apps/api/**"
              - *shared
            conductor:
              - "apps/conductor/**"
              - *shared

  deploy-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Unit tests under Bun, the Workers tests inside workerd, and both type checks — a deploy that fails here never ships.
      - run: bun run test && bun run compile
        working-directory: apps/api
      # The runner has Docker, so the ingest container image is built and pushed with the Worker.
      - run: bunx wrangler deploy
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-conductor:
    needs: changes
    if: needs.changes.outputs.conductor == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-conductor
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test && bun run check
        working-directory: apps/conductor
      - run: bunx wrangler deploy
        working-directory: apps/conductor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
