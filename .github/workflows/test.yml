name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  frozen-install:
    name: Frozen dependency install
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - name: Install without lockfile changes
        run: |
          bun install --frozen-lockfile
          git diff --exit-code -- bun.lock

  ci-contract:
    name: CI contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run CI contract tests
        run: bun test ./.github/workflows/ci.test.ts

  lint-changed:
    name: Lint changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check changed source quality
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base_sha="${BASE_SHA:-}"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "$base_sha^{commit}"
          code_list="$(mktemp)"
          text_list="$(mktemp)"
          trap 'rm -f "$code_list" "$text_list"' EXIT
          git diff --name-only --diff-filter=ACMRT -z "$base_sha" "$GITHUB_SHA" -- '*.ts' '*.tsx' '*.js' '*.mjs' > "$code_list"
          git diff --name-only --diff-filter=ACMRT -z "$base_sha" "$GITHUB_SHA" -- '*.json' '*.yml' '*.yaml' '*.md' > "$text_list"
          mapfile -d '' code_files < "$code_list"
          mapfile -d '' text_files < "$text_list"
          if ((${#code_files[@]})); then
            bunx --no-install oxlint "${code_files[@]}"
            bunx --no-install oxfmt --check "${code_files[@]}"
          fi
          if ((${#text_files[@]})); then
            bunx --no-install oxfmt --check "${text_files[@]}"
          fi

  test-mobile:
    name: Mobile tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run mobile tests
        run: bun run mobile:test

  test-server:
    name: Server tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run server tests
        run: bun run server:test

  test-conductor:
    name: Conductor tests and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run conductor tests
        run: bun run conductor:test
      - name: Typecheck conductor
        run: bun run conductor:check

  expo-config:
    name: Expo public config
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate Expo config
        run: bun run mobile:config > /dev/null

  test-fixtures:
    name: Fixture contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run route fixture contract
        run: bun --cwd apps/mobile test ./src/services/api/e2e-route-fixtures.test.ts

  website-boundary:
    name: Website build boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Refuse unowned website build claims
        run: |
          if [ -d apps/web ]; then
            echo "apps/web requires its own reviewed build and test job"
            exit 1
          fi

  quality-baseline:
    name: Baseline quality reports
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Report repository lint baseline
        continue-on-error: true
        run: bun run lint
      - name: Report mobile typecheck baseline
        continue-on-error: true
        run: bun run mobile:compile
      - name: Report server typecheck baseline
        continue-on-error: true
        run: bun run server:check
      - name: Report dependency audit baseline
        continue-on-error: true
        run: bun audit --audit-level=high
      - name: Record baseline scope
        if: always()
        run: |
          echo "Baseline reports are non-blocking until their tracked remediation lands."
          echo "No website build or production-data claim is made by this workflow."
