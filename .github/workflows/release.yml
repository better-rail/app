name: Mobile internal release candidate

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios

permissions:
  contents: read
  deployments: read

concurrency:
  group: mobile-internal-release
  cancel-in-progress: false

jobs:
  build:
    name: Build signed internal candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: mobile-release
    env:
      RELEASE_APPROVED_SHA: ${{ vars.MOBILE_RELEASE_APPROVED_SHA }}

    steps:
      - name: Verify protected release environment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment_json="$(
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/environments/mobile-release"
          )"
          jq -e '
            .deployment_branch_policy.protected_branches == true and
            any(.protection_rules[]?; .type == "required_reviewers" and (.reviewers | length > 0))
          ' <<<"$environment_json" >/dev/null

      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Setup EAS CLI
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e
        with:
          eas-version: 24.8.0
          eas-cache: false
          packager: bun

      - name: Verify trusted source
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_APPROVED_SHA"
          test "$RELEASE_APPROVED_SHA" = "$RELEASE_SHA"
          test "$RELEASE_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate source
        run: |
          bun test ./.github/workflows/release.test.ts
          bun run mobile:test
          bun --cwd apps/mobile test ./test/i18n.test.ts

      - name: Verify source was not modified
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain)"

      - name: Build signed internal candidate
        working-directory: apps/mobile
        shell: bash
        env:
          EAS_PLATFORM: ${{ inputs.platform }}
          EXPO_TOKEN: ${{ secrets.MOBILE_INTERNAL_EAS_TOKEN }}
        run: |
          set -uo pipefail
          result_file="${RUNNER_TEMP}/eas-build-result.json"
          set +e
          eas build --non-interactive --json --profile preview --platform "$EAS_PLATFORM" > "$result_file"
          build_status=$?
          set -e
          if [ ! -s "$result_file" ]; then
            if [ "$build_status" -ne 0 ]; then
              exit "$build_status"
            fi
            exit 1
          fi
          EAS_BUILD_RESULT="$result_file" node --input-type=module <<'NODE'
          import fs from "node:fs"
          import { summarizeEasBuilds } from "./scripts/summarize-eas-builds.mjs"

          const summary = summarizeEasBuilds(fs.readFileSync(process.env.EAS_BUILD_RESULT, "utf8"), process.env.EAS_PLATFORM, process.env.GITHUB_SHA)
          const rows = summary.map(build => `| ${build.platform} | ${build.id} | ${build.status} | ${build.appVersion ?? ""} | ${build.appBuildVersion ?? ""} |`).join("\n")
          const output = [
            "## Mobile internal release candidate",
            "",
            `- Git SHA: \`${process.env.GITHUB_SHA}\``,
            `- Git ref: \`${process.env.GITHUB_REF}\``,
            `- Initiator: \`${process.env.GITHUB_ACTOR}\``,
            `- EAS profile: \`preview\``,
            `- Workflow: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            "",
            "| Platform | EAS build ID | Status | App version | Build version |",
            "|---|---|---|---|---|",
            rows,
            "",
          ].join("\n")

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, output)
          console.log(output)
          NODE
          exit "$build_status"
